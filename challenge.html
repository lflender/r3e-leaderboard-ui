<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Picker - RaceRoom Leaderboards Explorer</title>
    <meta name="description" content="Randomly pick a car and track challenge for your next RaceRoom session.">
    <link rel="canonical" href="https://r3e-leaderboards.info/challenge.html">
    <link rel="alternate" hreflang="en" href="https://r3e-leaderboards.info/challenge.html">
    <link rel="alternate" hreflang="x-default" href="https://r3e-leaderboards.info/challenge.html">
    <meta name="robots" content="noindex, follow">
    <meta property="og:site_name" content="RaceRoom Leaderboards Explorer">
    <meta property="og:title" content="Challenge Picker - RaceRoom Leaderboards Explorer">
    <meta property="og:description" content="Randomly pick a car and track challenge for your next RaceRoom session.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://r3e-leaderboards.info/challenge.html">
    <meta property="og:image" content="https://r3e-leaderboards.info/images/rle-share.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="RaceRoom Challenge Picker">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Challenge Picker - RaceRoom Leaderboards Explorer">
    <meta name="twitter:description" content="Randomly pick a car and track challenge for your next RaceRoom session.">
    <meta name="twitter:image" content="https://r3e-leaderboards.info/images/rle-share.png">

    <script src="modules/analytics.js?v=8" defer></script>
    <link rel="stylesheet" href="style.css?v=266">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=3">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <h1 class="sr-only">RaceRoom Challenge Picker</h1>
        <div class="tabs" id="site-tabs" data-active="challenge"></div>

        <div class="tab-content">
            <div id="challenge-panel" class="tab-panel active">
                <div class="challenge-mode-toggle" role="radiogroup" aria-label="Challenge mode">
                    <button type="button" class="challenge-mode-btn" data-mode="car" aria-checked="false" role="radio">Car</button>
                    <button type="button" class="challenge-mode-btn is-active" data-mode="both" aria-checked="true" role="radio">Both</button>
                    <button type="button" class="challenge-mode-btn" data-mode="track" aria-checked="false" role="radio">Track</button>
                </div>

                <div class="challenge-filters" id="challenge-filters">
                    <div id="challenge-era-filter" class="custom-select" role="listbox" aria-label="Filter by era">
                        <button type="button" class="custom-select__toggle" aria-haspopup="listbox" aria-expanded="false">All years ▾</button>
                        <div class="custom-select__menu" role="presentation" hidden></div>
                    </div>
                    <div id="challenge-wheel-filter" class="custom-select" role="listbox" aria-label="Filter by wheel type">
                        <button type="button" class="custom-select__toggle" aria-haspopup="listbox" aria-expanded="false">All wheels ▾</button>
                        <div class="custom-select__menu" role="presentation" hidden></div>
                    </div>
                    <div id="challenge-trans-filter" class="custom-select" role="listbox" aria-label="Filter by transmission">
                        <button type="button" class="custom-select__toggle" aria-haspopup="listbox" aria-expanded="false">All transmissions ▾</button>
                        <div class="custom-select__menu" role="presentation" hidden></div>
                    </div>
                    <div id="challenge-rating-filter" class="custom-select" role="listbox" aria-label="Filter by rating">
                        <button type="button" class="custom-select__toggle" aria-haspopup="listbox" aria-expanded="false">All ratings ▾</button>
                        <div class="custom-select__menu" role="presentation" hidden></div>
                    </div>
                    <label class="challenge-group-category">
                        <input type="checkbox" id="challenge-group-category-cb">
                        <span class="challenge-group-category__label">Group categories</span>
                        <span class="info-icon" title="Shows all classes from picked category and avoids picking from the same category in a row. Categories are: Audi Cup, Classics, DTM 2010s, e-Sedan, GT3, Porsche Cup, WTCC, WTCR" aria-label="Group categories info" role="img">i</span>
                    </label>
                </div>

                <div class="challenge-pickers">
                    <div class="challenge-exclusions" id="challenge-exclusions">
                        <div class="challenge-exclusions__toggle" id="challenge-exclusions-toggle" role="button" tabindex="0" aria-expanded="false">
                            <span class="challenge-exclusions__arrow">&#9654;</span>
                            <span>Exclusions</span>
                            <span class="challenge-exclusions__badge" id="challenge-exclusions-badge"></span>
                            <button type="button" class="challenge-exclusions__reset" id="challenge-exclusions-reset" hidden>Reset</button>
                        </div>
                        <div class="challenge-exclusions__body" id="challenge-exclusions-body">
                            <div class="challenge-exclusions__col">
                                <div class="challenge-exclusions__col-title">Tracks</div>
                                <div class="challenge-exclusions__list" id="challenge-exclusions-tracks"></div>
                            </div>
                            <div class="challenge-exclusions__col">
                                <div class="challenge-exclusions__col-title">Car Classes</div>
                                <div class="challenge-exclusions__list" id="challenge-exclusions-cars"></div>
                            </div>
                        </div>
                    </div>

                    <div id="challenge-track-stats"></div>

                    <div class="challenge-picker challenge-picker--car" id="challenge-car-picker">
                        <div class="challenge-picker__options" role="radiogroup" aria-label="Car pick granularity">
                            <button type="button" class="challenge-granularity-btn is-active" data-granularity="class" aria-checked="true" role="radio">Class</button>
                            <button type="button" class="challenge-granularity-btn" data-granularity="car" aria-checked="false" role="radio">Car</button>
                        </div>
                        <div class="challenge-picker__result" id="challenge-car-result"></div>
                    </div>

                    <div class="challenge-picker challenge-picker--track" id="challenge-track-picker">
                        <div class="challenge-picker__options" role="radiogroup" aria-label="Track pick granularity">
                            <button type="button" class="challenge-granularity-btn is-active" data-granularity="track" aria-checked="true" role="radio">Track</button>
                            <button type="button" class="challenge-granularity-btn" data-granularity="layout" aria-checked="false" role="radio">Layout</button>
                        </div>
                        <div class="challenge-picker__result" id="challenge-track-result"></div>
                    </div>
                </div>

                <div class="challenge-action">
                    <button type="button" class="challenge-repick-btn" id="repick-car-btn" disabled>Re-Pick Car</button>
                    <button type="button" class="challenge-pick-btn" id="challenge-pick-btn">Pick!</button>
                    <button type="button" class="challenge-repick-btn" id="repick-track-btn" disabled>Re-Pick Track</button>
                </div>
                <div class="challenge-action">
                    <label class="challenge-hardcore-label" id="challenge-hardcore-label">
                        <input type="checkbox" id="challenge-hardcore-cb">
                        <span>Hardcore</span>
                        <span class="info-icon" id="challenge-hardcore-info" aria-label="Hardcore info" role="img">i</span>
                    </label>
                </div>
            </div>
        </div>

        <section class="seo-content" aria-label="About the Challenge Picker">
            <p class="page-intro">Randomly pick a <strong>car class</strong>, <strong>specific car</strong>, <strong>track</strong> or <strong>layout</strong> for your next <strong>RaceRoom</strong> session. Use the toggles to choose what to randomize and hit <em>Pick!</em><br/>Or go back to this week's <a href="/" class="internal-link">ranked multiplayer races</a>.</p>
        </section>
    </main>

    <div id="site-footer"></div>

    <!-- Loaders -->
    <script src="modules/loaders/template-loader.js?v=2" defer></script>
    <script src="modules/loaders/tabs-loader.js?v=6" defer></script>
    <script src="modules/loaders/footer-loader.js?v=2" defer></script>
    <script src="modules/loaders/header-loader.js?v=2" defer></script>

    <!-- Data files -->
    <script src="modules/data/car-classes.js?v=3" defer></script>
    <script src="modules/data/cars.js?v=10" defer></script>
    <script src="modules/data/tracks.js?v=5" defer></script>
    <script src="modules/data/track-images.js?v=3" defer></script>
    <script src="modules/data/country-mappings.js?v=5" defer></script>

    <!-- Core modules -->
    <script src="modules/compressed-json-helper.js?v=2" defer></script>
    <script src="modules/field-mappings.js?v=4" defer></script>
    <script src="modules/data-service.js?v=41" defer></script>
    <script src="modules/data-normalizer.js?v=4" defer></script>
    <script src="modules/time-helper.js?v=1" defer></script>
    <script src="modules/custom-select.js?v=9" defer></script>
    <script src="modules/flag-helper.js?v=2" defer></script>
    <script src="modules/car-ratings.js?v=5" defer></script>
    <script src="modules/utils-track.js?v=1" defer></script>
    <script src="modules/utils-car.js?v=13" defer></script>
    <script src="modules/utils.js?v=12" defer></script>

    <!-- Page modules -->
    <script src="modules/challenge-picker-service.js?v=12" defer></script>
    <script src="modules/pages/challenge-picker.js?v=45" defer></script>

    <script src="script.js?v=9" defer></script>
</body>
</html>
